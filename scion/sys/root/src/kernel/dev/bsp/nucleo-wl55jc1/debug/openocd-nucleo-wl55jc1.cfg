# OpenOCD — NUCLEO-WL55JC1, sonde STLINK-V3 intégrée (USB direct). Étape 6 : flash (cible CMake
# « flash », flash interne seulement : ni option bytes, ni protection, ni zone sécurisée),
# débogage (gdb, port 3333) du Cortex-M4 (CPU1). Fichier autonome (champ openocd du manifeste, ENV-9 :
# launch de lepton generate) ; le numéro de série de la sonde est ajouté par la cfg générée
# (CMakeLists.txt du BSP nucleo-wl55jc1), qui source ce fichier.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32wlx.cfg]
reset_config srst_only srst_nogate
